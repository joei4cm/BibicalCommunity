# LogosHome API — Cloudflare production config (Workers + D1 + R2 + CallRoom DO)
#
# Deploy:
#   wrangler deploy -c wrangler.production.toml
# Migrate:
#   wrangler d1 migrations apply logoshome --remote -c wrangler.production.toml
# Preflight (no network / no secrets required):
#   bash scripts/deploy-check.sh
#
# Do not commit real IDs or secret values. Replace YOUR_* placeholders below.

# ── Required secrets (wrangler secret put NAME -c wrangler.production.toml) ──
#   HANDLE_PEPPER   — HMAC pepper for handle/email hashing (auth identity)
#   KEK_MASTER      — AES master key for field-level encryption (≥32 chars)
#   TURN_SECRET     — ephemeral TURN HMAC secret (calls / WebRTC)
# Session tokens are opaque bearers hashed in D1 (no separate JWT secret).
# Partner SSO (恩道 / 微读): keep ENDAO_SSO_ENABLED / WEREAD_SSO_ENABLED false
# until real OAuth client_id + token exchange are configured; never enable
# PARTNER_SSO_MOCK in production.
#
# When enabling real partner OAuth (PARTNER_SSO_MOCK must stay "false"):
#   ENDAO_OAUTH_CLIENT_ID / WEREAD_OAUTH_CLIENT_ID — public OAuth client_id vars
#   PARTNER_OAUTH_REDIRECT_BASE — public API origin, e.g. https://api.example.com
#     (redirect_uri becomes ${base}/v1/partners/{endao|weread}/callback)
#   ENDAO_OAUTH_AUTHORIZE_BASE / WEREAD_OAUTH_AUTHORIZE_BASE — optional host overrides
# Token exchange: set client secrets + optional token URL overrides, then flip SSO.
#   wrangler secret put ENDAO_OAUTH_CLIENT_SECRET -c wrangler.production.toml
#   wrangler secret put WEREAD_OAUTH_CLIENT_SECRET -c wrangler.production.toml
# Optional vars: ENDAO_OAUTH_TOKEN_URL / WEREAD_OAUTH_TOKEN_URL
#
#   wrangler secret put HANDLE_PEPPER -c wrangler.production.toml
#   wrangler secret put KEK_MASTER -c wrangler.production.toml
#   wrangler secret put TURN_SECRET -c wrangler.production.toml

# ── Required bindings (declared below) ──────────────────────────────────────
#   DB         — D1 database (logoshome)
#   MEDIA      — R2 bucket (bible chapter JSON + media)
#   CALL_ROOM  — Durable Object namespace → CallRoomDO (WebRTC signaling)

name = "logoshome-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"

[[d1_databases]]
binding = "DB"
database_name = "logoshome"
# Replace with the UUID from: wrangler d1 create logoshome
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
# Replace with production bucket name from: wrangler r2 bucket create logoshome-media
bucket_name = "logoshome-media"

# Optional custom domain / zone routes (uncomment and fill):
# [[routes]]
# pattern = "api.example.com/*"
# zone_name = "example.com"

[durable_objects]
bindings = [
  { name = "CALL_ROOM", class_name = "CallRoomDO" }
]

[[migrations]]
tag = "v1"
new_classes = ["CallRoomDO"]

[triggers]
crons = ["*/5 * * * *"]

[vars]
APP_NAME = "LogosHome"
ENVIRONMENT = "production"
# Partner SSO feature flags — leave false until real IdP credentials exist.
ENDAO_SSO_ENABLED = "false"
WEREAD_SSO_ENABLED = "false"
# Must be false in production (mock IdP must never be reachable live).
PARTNER_SSO_MOCK = "false"
# Uncomment and set when partner OAuth apps are provisioned (with SSO flags):
# ENDAO_OAUTH_CLIENT_ID = "YOUR_ENDAO_CLIENT_ID"
# WEREAD_OAUTH_CLIENT_ID = "YOUR_WEREAD_CLIENT_ID"
# PARTNER_OAUTH_REDIRECT_BASE = "https://api.example.com"
# ENDAO_OAUTH_AUTHORIZE_BASE = "https://oauth.edobible.com/authorize"
# WEREAD_OAUTH_AUTHORIZE_BASE = "https://open.weixin.qq.com/connect/oauth2/authorize"
# TURN_URIS is non-secret; TURN_SECRET must be a wrangler secret.
# Include turn:/turns: hosts for relay (coturn). Or set secrets TURN_CF_KEY_ID +
# TURN_CF_API_TOKEN for Cloudflare Calls TURN (preferred when available).
TURN_URIS = "[\"stun:stun.cloudflare.com:3478\",\"stun:stun.l.google.com:19302\"]"
