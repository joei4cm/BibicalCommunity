name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @logoshome/shared --filter @logoshome/bible --filter @logoshome/crypto --filter @logoshome/ui build
      - run: pnpm --filter @logoshome/bible test
      - run: pnpm --filter @logoshome/api typecheck
      - run: pnpm --filter @logoshome/web build
