# Deploy LogosHome API (Workers + D1 + R2 + DO) and web (Pages).
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#
# Optional GitHub secrets (synced to the Worker when present):
#   HANDLE_PEPPER
#   KEK_MASTER
#   TURN_SECRET
#   TURN_CF_KEY_ID          — Cloudflare Calls TURN key id (preferred relay)
#   TURN_CF_API_TOKEN      — Cloudflare Calls TURN API token
#   PLATFORM_ADMIN_BOOTSTRAP_SECRET
#
# Manual: Actions → Deploy Cloudflare → Run workflow
# Auto: push to main (after secrets are configured)

name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "FAIL: set repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          echo "OK: Cloudflare secrets present (account=${CLOUDFLARE_ACCOUNT_ID:0:8}…)"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - run: pnpm --filter @logoshome/shared --filter @logoshome/bible --filter @logoshome/crypto --filter @logoshome/ui build

      - name: Prepare production wrangler config (D1 + R2)
        run: bash scripts/cf-prepare-prod-config.sh

      - name: Apply D1 migrations (remote)
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply logoshome --remote -c wrangler.production.ci.toml

      - name: Deploy API Worker
        id: deploy_api
        working-directory: apps/api
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy -c wrangler.production.ci.toml | tee /tmp/cf-deploy-api.log
          BASE=$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' /tmp/cf-deploy-api.log | head -1 || true)
          if [ -z "$BASE" ]; then
            echo "FAIL: could not parse workers.dev URL from wrangler deploy output"
            exit 1
          fi
          echo "api_base=$BASE" >> "$GITHUB_OUTPUT"
          echo "LIVE_API_BASE=$BASE"

      - name: Sync optional Worker secrets
        working-directory: apps/api
        env:
          HANDLE_PEPPER: ${{ secrets.HANDLE_PEPPER }}
          KEK_MASTER: ${{ secrets.KEK_MASTER }}
          TURN_SECRET: ${{ secrets.TURN_SECRET }}
          TURN_CF_KEY_ID: ${{ secrets.TURN_CF_KEY_ID }}
          TURN_CF_API_TOKEN: ${{ secrets.TURN_CF_API_TOKEN }}
          PLATFORM_ADMIN_BOOTSTRAP_SECRET: ${{ secrets.PLATFORM_ADMIN_BOOTSTRAP_SECRET }}
        run: |
          CFG=wrangler.production.ci.toml
          sync_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | pnpm exec wrangler secret put "$name" -c "$CFG"
              echo "OK: synced secret $name"
            else
              echo "INFO: optional secret $name not set in GitHub — skip (set later via wrangler secret put)"
            fi
          }
          sync_secret HANDLE_PEPPER "$HANDLE_PEPPER"
          sync_secret KEK_MASTER "$KEK_MASTER"
          sync_secret TURN_SECRET "$TURN_SECRET"
          sync_secret TURN_CF_KEY_ID "$TURN_CF_KEY_ID"
          sync_secret TURN_CF_API_TOKEN "$TURN_CF_API_TOKEN"
          if [ -z "$TURN_CF_KEY_ID" ] || [ -z "$TURN_CF_API_TOKEN" ]; then
            echo "WARN: TURN_CF_KEY_ID / TURN_CF_API_TOKEN missing — calls stay STUN-only until Cloudflare Calls TURN secrets are set (or TURN_URIS includes turn: hosts + TURN_SECRET)."
          fi
          sync_secret PLATFORM_ADMIN_BOOTSTRAP_SECRET "$PLATFORM_ADMIN_BOOTSTRAP_SECRET"

      - name: Health check API
        run: |
          BASE="${{ steps.deploy_api.outputs.api_base }}"
          echo "GET $BASE/health"
          for i in 1 2 3 4 5; do
            if curl -sf "$BASE/health"; then
              echo
              echo "OK: Worker health"
              exit 0
            fi
            sleep 3
          done
          echo "FAIL: Worker health check"
          exit 1

      - name: Build web (VITE_API_BASE → Worker)
        env:
          VITE_API_BASE: ${{ steps.deploy_api.outputs.api_base }}
        run: pnpm --filter @logoshome/web build

      - name: Deploy web to Cloudflare Pages
        # wrangler lives on @logoshome/api; deploy the web build from apps/web/dist.
        working-directory: apps/api
        run: |
          # Create project if missing (ignore already-exists).
          pnpm exec wrangler pages project create logoshome-web --production-branch main 2>/dev/null \
            || echo "INFO: pages project may already exist"
          pnpm exec wrangler pages deploy ../web/dist --project-name=logoshome-web --commit-dirty=true

      - name: Summary
        run: |
          echo "## Cloudflare deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: \`${{ steps.deploy_api.outputs.api_base }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pages project: \`logoshome-web\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Optional Worker secrets: HANDLE_PEPPER / KEK_MASTER / TURN_SECRET / TURN_CF_KEY_ID / TURN_CF_API_TOKEN (sync when present)" >> "$GITHUB_STEP_SUMMARY"
